[models] # 模型及配置文件路径（相对于上位机 config.ini 所在目录）
yolo_model_path=onnx_model\yolov8_seg_0720.onnx # YOLOv8-Seg 模型路径
patchcore_model_path=onnx_model\patchcore_backbone.onnx # PatchCore ONNX 模型路径
faiss_index_path=onnx_model\nnscorer_search_index.faiss # PatchCore FAISS 索引文件
metadata_path=onnx_model\model_metadata.json # PatchCore 元数据文件

[ort] # ONNX Runtime 配置
intra_threads=2 # 推理线程数（0=使用 ONNX Runtime 默认值）

[yolo] # YOLO 检测参数
enabled=1 # 是否启用 YOLOv8-Seg 模型：1=启用，0=禁用
score_threshold=0.25 # 最小置信度阈值
iou_threshold=0.2 # NMS IoU 阈值
nms_class_aware=1 # 0=全局 NMS，1=按类别执行 NMS

[patchcore] # PatchCore 检测参数
enabled=1 # 是否启用 PatchCore 模型：1=启用，0=禁用
score_threshold=1.4 # 图像级异常分数阈值
area_threshold=1.4 # 异常热图二值化阈值
mask_area_threshold=0.3 # 最小异常区域面积占比阈值

[log] # 日志配置
enabled=1 # 是否启用日志
level=debug # debug、info、warning 或 error
log_to_stderr=1 # 是否输出到终端
log_to_file=0 # 是否保存到日志文件
file_path=logs\inspection.log # 日志文件路径

[post] # 后处理及可视化配置
dark_clusters_threshold=0.8 # Stain 重分类为 DarkClusters 的对比度阈值
draw_defect_box=1 # 是否绘制缺陷框
expand_defect_box=1 # 1=绘制框四边各向外扩展 3 像素，0=保持原框
draw_box_details=1 # 是否绘制类别、面积、对比度等信息
draw_defect_mask=0 # 是否绘制缺陷 Mask
concat_original_image=0 # 是否拼接原图
defect_mask_color_r=255 # Mask 红色分量
defect_mask_color_g=0 # Mask 绿色分量
defect_mask_color_b=0 # Mask 蓝色分量
defect_mask_alpha=0.05 # Mask 透明度（0.0~1.0）

[Abormal_config] # Abnormal 检测配置（名称与底层现有配置键保持一致）
Enable=true # 是否启用
score_threshold_1=1.4 # 第一分数阈值
score_threshold_2=2.0 # 第二分数阈值
area_threshold_1=0.3 # 与第一分数阈值配合使用的面积占比阈值
contrast_threshold=0 # 最小对比度
min_width=0 # 最小宽度
min_height=0 # 最小高度
min_area=0 # 最小面积

[Stain_config] # Stain 类别过滤配置
Enable=True # 是否启用
use_traditional_measure=1 # 是否使用传统图像算法重新计算面积和尺寸
confidence_threshold=0.25 # 最小置信度
contrast_threshold=0 # 最小对比度
min_width=0 # 最小宽度
min_height=0 # 最小高度
min_area=0 # 最小面积

[DarkClusters_config] # DarkClusters 类别过滤配置
Enable=True # 是否启用
use_traditional_measure=1 # 是否使用传统图像算法重新计算面积和尺寸
confidence_threshold=0.25 # 最小置信度
contrast_threshold=0 # 最小对比度
min_width=0 # 最小宽度
min_height=0 # 最小高度
min_area=0 # 最小面积

[BrightStripes_config] # BrightStripes 类别过滤配置
Enable=True # 是否启用
confidence_threshold=0.25 # 最小置信度
contrast_threshold=0 # 最小对比度
min_width=0 # 最小宽度
min_height=0 # 最小高度
min_area=0 # 最小面积

[LineArtifacts_config] # LineArtifacts 类别过滤配置
Enable=True # 是否启用
confidence_threshold=0.25 # 最小置信度
contrast_threshold=0 # 最小对比度
min_width=0 # 最小宽度
min_height=0 # 最小高度
min_area=0 # 最小面积
