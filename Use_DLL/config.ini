[models] # 模型/文件路径（支持相对路径：相对 config.ini 所在目录）
yolo_model_path=onnx_model\yolov8_seg.onnx # YOLOv8 分割模型路径
patchcore_model_path=onnx_model\patchcore_backbone.onnx # PatchCore ONNX 模型路径
faiss_index_path=onnx_model\nnscorer_search_index.faiss # FAISS 索引路径
metadata_path=onnx_model\model_metadata.json # PatchCore 元数据路径

[ort]
intra_threads=4 # ONNX Runtime 线程数

[yolo]
score_threshold=0.25 # 置信度阈值（低于该值的目标会在模型输出阶段被抑制）
iou_threshold=0.2 # NMS IoU 阈值
nms_class_aware=0 # 0=全局NMS, 1=按类别NMS

[patchcore]
score_threshold=1.4 # PatchCore 图像级分数阈值（用于 has_defect 判定）
area_threshold=1.4 # PatchCore area_mask 二值化阈值（用于计算 area_ratio 与 bbox）
mask_area_threshold=0.3 # PatchCore 异常区域面积占比阈值（area_ratio），用于 has_defect 判定

[post]
contrast_mode=1 # 0=局部环形背景，1=自适应局部平面，2=全 FOV 中位数背景（排除黑边）
draw_defect_box=1
expand_defect_box=1 # 1=绘制框四边各向外扩展 3 像素，0=保持原框
draw_defect_mask=0
concat_original_image=0
defect_mask_color_r=255
defect_mask_color_g=0
defect_mask_color_b=0
defect_mask_alpha=0.35
draw_box_details=1 # 0表示不画缺陷信息，1表示画缺陷信息

[category_mapping] # 最终输出类别名映射；未配置的类别保持原名
# Stain=SurfaceDefect
# BrightStripes=BrightLine

[Abormal_config] # Abnormal(PatchCore) 类别过滤与阈值
Enable=true # 是否启用 Abnormal 判定与输出
score_threshold_1=1.4 # score>=该阈值时，需同时满足 area_ratio>=area_threshold_1 才触发 Abnormal
score_threshold_2=2.0 # score>=该阈值时，直接触发 Abnormal（不要求 area_ratio）
area_threshold_1=0.3 # 面积占比阈值（area_ratio）
contrast_threshold=0 # 对比度阈值（保留 contrast>=该值）
min_width=0 # 最小宽度阈值（像素）
min_height=0 # 最小高度阈值（像素）
min_area=0 # 最小面积阈值（像素数）

[Stain_config]
Enable=True # 是否输出/计数该类别
use_traditional_measure=1 # 1=使用传统图像算法在 YOLO 框内重新计算面积/宽高并更新输出（不影响置信度），0=使用 YOLO 输出
confidence_threshold=0.25 # 置信度阈值（保留 score>=该值）
contrast_threshold=0 # 对比度阈值（保留 contrast>=该值）
min_width=5 # 最小宽度阈值（像素）
min_height=5 # 最小高度阈值（像素）
min_area=0 # 最小面积阈值（像素数）

[Brightstripes_config]
Enable=True # 是否输出/计数该类别
confidence_threshold=0.25 # 置信度阈值（保留 score>=该值）
contrast_threshold=0 # 对比度阈值（保留 contrast>=该值）
min_width=0 # 最小宽度阈值（像素）
min_height=0 # 最小高度阈值（像素）
min_area=0 # 最小面积阈值（像素数）

[Lineartifacts_config]
Enable=True # 是否输出/计数该类别
confidence_threshold=0.25 # 置信度阈值（保留 score>=该值）
contrast_threshold=0 # 对比度阈值（保留 contrast>=该值）
min_width=0 # 最小宽度阈值（像素）
min_height=0 # 最小高度阈值（像素）
min_area=0 # 最小面积阈值（像素数）








