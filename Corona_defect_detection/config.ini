[models]
yolo_model_path=..\..\onnx_model\yolov8_seg.onnx
patchcore_model_path=..\..\onnx_model\patchcore_backbone.onnx
faiss_index_path=..\..\onnx_model\nnscorer_search_index.faiss
metadata_path=..\..\onnx_model\model_metadata.json

[ort]
intra_threads=4

[yolo]
score_threshold=0.25
iou_threshold=0.2
nms_class_aware=0

[patchcore]
score_threshold=1.4
area_threshold=1.4
mask_area_threshold=0.3

[post]
dark_clusters_threshold=0.8
draw_box_details=1

[log]
enabled=1
level=info
log_to_stderr=1
log_to_file=0
file_path=logs\inspection.log

[Abormal_config]
Enable=True
score_threshold_1=1.4
score_threshold_2=2.0
area_threshold_1=0.3
contrast_threshold=0
min_width=0
min_height=0
min_area=0

[Stain_config]
Enable=True
use_traditional_measure=0
confidence_threshold=0.25
contrast_threshold=0
min_width=0
min_height=0
min_area=0

[Darkclusters_config]
Enable=True
use_traditional_measure=0
confidence_threshold=0.25
contrast_threshold=0
min_width=0
min_height=0
min_area=0

[Brightstripes_config]
Enable=True
confidence_threshold=0.25
contrast_threshold=0
min_width=0
min_height=0
min_area=0

[Lineartifacts_config]
Enable=True
confidence_threshold=0.25
contrast_threshold=0
min_width=0
min_height=0
min_area=0
