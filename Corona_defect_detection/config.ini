[models]                          # 模型及配置文件路径（支持相对路径，相对于 config.ini 所在目录）
yolo_model_path=..\onnx_model\yolov8_seg_0720.onnx          # YOLOv8-Seg 模型路径
patchcore_model_path=..\onnx_model\patchcore_backbone.onnx  # PatchCore ONNX 模型路径
faiss_index_path=..\onnx_model\nnscorer_search_index.faiss  # PatchCore FAISS 索引文件路径
metadata_path=..\onnx_model\model_metadata.json             # PatchCore 元数据文件路径

[ort]                             # ONNX Runtime 配置
intra_threads=2                   # 推理线程数（0=使用 ONNX Runtime 默认值）

[yolo]                            # YOLO 检测参数
enabled=1                         # 是否启用 YOLOv8-Seg 模型：1=启用，0=禁用
score_threshold=0.25              # 最小置信度阈值（score >= 该值的检测结果才会进入后处理）
iou_threshold=0.2                 # NMS IoU 阈值（用于去除重叠检测框）
nms_class_aware=1                 # NMS 模式：0=全局 NMS，1=按类别分别进行 NMS

[patchcore]                       # PatchCore 检测参数
enabled=1                         # 是否启用 PatchCore 模型：1=启用，0=禁用
score_threshold=1.4               # 图像级异常分数阈值（score >= 该值时判定存在异常候选）
area_threshold=1.4                # 异常热图二值化阈值（用于生成异常区域 Mask）
mask_area_threshold=0.3           # 最小异常区域面积占比阈值（area_ratio >= 该值时判定存在异常）

[log]
enabled=1              # 是否启用日志：1=启用，0=禁用
level=debug            # 日志级别（debug、info、warning、error）
log_to_stderr=1        # 是否输出到终端：1=是，0=否
log_to_file=0          # 是否保存到日志文件：1=是，0=否
file_path=logs\inspection.log   # 日志文件保存路径

[post]
dark_clusters_threshold=0.8    # Stain 重分类为 DarkClusters 的对比度阈值（contrast <= threshold 时判定为 DarkClusters）
suppress_patchcore_when_yolo_detected=0  # YOLO 过滤后有输出时，是否不将 PatchCore Abnormal 明细放入最终结果：1=是，0=否
draw_defect_box=1              # 是否绘制缺陷框：1=是，0=否
expand_defect_box=1            # 绘制时是否将缺陷框四边各向外扩展 3 像素：1=是，0=否
draw_box_details=1             # 是否绘制缺陷信息（类别、面积、对比度等）：1=是，0=否
draw_defect_mask=0             # 是否绘制缺陷 Mask：1=是，0=否
concat_original_image=0        # 是否拼接原图：1=左侧原图、右侧标注图；0=仅输出标注图
defect_mask_color_r=255        # 缺陷 Mask 颜色（R 分量，0~255）
defect_mask_color_g=0          # 缺陷 Mask 颜色（G 分量，0~255）
defect_mask_color_b=0          # 缺陷 Mask 颜色（B 分量，0~255）
defect_mask_alpha=0.05         # 缺陷 Mask 透明度（0.0~1.0，0=完全透明，1=完全不透明）

[AA]                            # YOLO 最终结果的 AA 区域规则过滤
enabled=1                       # 是否启用 AA 过滤：1=启用，0=禁用
center_y_min=665                # 缺陷框中心 Y 坐标下限（包含）
center_y_max=715                # 缺陷框中心 Y 坐标上限（包含）
min_width_height_ratio=3.0      # 宽高比严格大于该值时才过滤
categories=Stain,DarkClusters   # 要应用规则的类别，英文逗号分隔，不区分大小写

[Abormal_config]
Enable=true                      # 是否启用 Abnormal 检测：1=启用，0=禁用（支持 true/false）
score_threshold_1=1.4            # 第一分数阈值：score >= 该值时，需同时满足 area_ratio >= area_threshold_1 才判定为 Abnormal
score_threshold_2=2.0            # 第二分数阈值：score >= 该值时，直接判定为 Abnormal（忽略 area_ratio）
area_threshold_1=0.3            # 面积占比阈值（area_ratio），与 score_threshold_1 配合使用
contrast_threshold=0            # 最小对比度阈值（contrast >= 该值时保留）
min_width=0                     # 最小宽度阈值（像素，width >= 该值时保留）
min_height=0                    # 最小高度阈值（像素，height >= 该值时保留）
min_area=0                      # 最小面积阈值（像素，area >= 该值时保留）

[Stain_config]                    # Stain 类别过滤配置
Enable=True                       # 是否启用该类别：1=启用，0=禁用（支持 true/false）
use_traditional_measure=1         # 是否使用传统图像算法重新计算面积和尺寸：1=是，0=否（仅更新面积、宽、高等几何信息，不影响置信度）
confidence_threshold=0.25         # 最小置信度阈值（score >= 该值时保留）
contrast_threshold=0              # 最小对比度阈值（contrast >= 该值时保留）
min_width=0                       # 最小宽度阈值（像素，width >= 该值时保留）
min_height=0                      # 最小高度阈值（像素，height >= 该值时保留）
min_area=0                        # 最小面积阈值（像素，area >= 该值时保留）

[DarkClusters_config]             # DarkClusters 类别过滤配置（由 Stain 后处理重分类得到）
Enable=True                       # 是否启用该类别：1=启用，0=禁用（支持 true/false）
use_traditional_measure=1         # 是否使用传统图像算法重新计算面积和尺寸：1=是，0=否（仅更新面积、宽、高等几何信息，不影响置信度）
confidence_threshold=0.25         # 最小置信度阈值（score >= 该值时保留）
contrast_threshold=0              # 最小对比度阈值（contrast >= 该值时保留）
min_width=0                       # 最小宽度阈值（像素，width >= 该值时保留）
min_height=0                      # 最小高度阈值（像素，height >= 该值时保留）
min_area=0                        # 最小面积阈值（像素，area >= 该值时保留）

[BrightStripes_config]            # BrightStripes 类别过滤配置
Enable=True                       # 是否启用该类别：1=启用，0=禁用（支持 true/false）
confidence_threshold=0.25         # 最小置信度阈值（score >= 该值时保留）
contrast_threshold=0              # 最小对比度阈值（contrast >= 该值时保留）
min_width=0                       # 最小宽度阈值（像素，width >= 该值时保留）
min_height=0                      # 最小高度阈值（像素，height >= 该值时保留）
min_area=0                        # 最小面积阈值（像素，area >= 该值时保留）

[LineArtifacts_config]            # LineArtifacts 类别过滤配置
Enable=True                       # 是否启用该类别：1=启用，0=禁用（支持 true/false）
confidence_threshold=0.25         # 最小置信度阈值（score >= 该值时保留）
contrast_threshold=0              # 最小对比度阈值（contrast >= 该值时保留）
min_width=0                       # 最小宽度阈值（像素，width >= 该值时保留）
min_height=0                      # 最小高度阈值（像素，height >= 该值时保留）
min_area=0                        # 最小面积阈值（像素，area >= 该值时保留）








